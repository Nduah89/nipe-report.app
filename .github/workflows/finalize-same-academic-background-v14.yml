name: Finalize same Edusentia academic background v14

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-same-academic-background-v14.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce same academic background lineage
        shell: bash
        run: |
          set -euo pipefail
          git show 6c7720ae1cc0df9b5ec0ea4466aed6b781c12179:assets/edusentia-login-background-final.webp > /tmp/source.webp
          test "$(git hash-object /tmp/source.webp)" = "6f0fa56f3a00e9a4e82d2a7f40591c0c5254e9db"
          test "$(stat -c%s /tmp/source.webp)" = "10712"
          test "$(head -c 4 /tmp/source.webp)" = "RIFF"
          test "$(dd if=/tmp/source.webp bs=1 skip=8 count=4 status=none)" = "WEBP"
          keep=0
          if grep -q 'r37-final-ui-12-same-background-sharpened' index.html && [ -f assets/edusentia-login-background-final.webp ]; then
            s="$(stat -c%s assets/edusentia-login-background-final.webp)"
            if [ "$s" -ge 30000 ] && [ "$(head -c 4 assets/edusentia-login-background-final.webp)" = "RIFF" ] && [ "$(dd if=assets/edusentia-login-background-final.webp bs=1 skip=8 count=4 status=none)" = "WEBP" ]; then keep=1; fi
          fi
          if [ "$keep" = "0" ]; then
            cp /tmp/source.webp assets/edusentia-login-background-final.webp
            sed -i -E 's/r37-final-ui-(11-asset-repair|12-same-background-sharpened|13-exact-academic-source)/r37-final-ui-14-same-academic-background/g' index.html service-worker.js
            grep -q 'r37-final-ui-14-same-academic-background' index.html
            grep -q 'r37-final-ui-14-same-academic-background' service-worker.js
          fi
      - name: Remove temporary visual-release residue
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/promote-same-background-v12.yml
          rm -f .github/workflows/finalize-same-academic-background-v13.yml
          rm -f .github/workflows/finalize-same-academic-background-v14.yml
      - name: Commit final clean state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enforce same Edusentia academic login background"
          git push
