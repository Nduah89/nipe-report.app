name: Apply approved r37 final-ui-8 runtime

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-approved-hero-v8-runtime.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact v8 runtime references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          idx=Path('index.html')
          s=idx.read_text()
          if 'r37-final-ui-6' not in s:
              raise SystemExit('Expected final-ui-6 reference not found in index.html')
          s=s.replace('r37-final-ui-6','r37-final-ui-8')
          idx.write_text(s)

          sw=Path('service-worker.js')
          s=sw.read_text()
          if 'v7-4-0-r37-edusentia-final-ui-6' not in s:
              raise SystemExit('Expected final-ui-6 cache not found in service-worker.js')
          s=s.replace('v7-4-0-r37-edusentia-final-ui-6','v7-4-0-r37-edusentia-final-ui-8')
          s=s.replace('"assets/edusentia-login-background-r37.svg",','')
          sw.write_text(s)
          PY
          grep -q 'r37-final-ui-8' index.html
          grep -q 'v7-4-0-r37-edusentia-final-ui-8' service-worker.js
          ! grep -q 'assets/edusentia-login-background-r37.svg' service-worker.js
          grep -q 'id="loginForm"' index.html
          grep -q 'id="loginEmail"' index.html
          grep -q 'id="loginPassword"' index.html
          grep -q 'id="togglePassword"' index.html
          grep -q 'id="mfaForm"' index.html
      - name: Commit runtime switch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Activate approved r37 login visual final-ui-8"
          git push
